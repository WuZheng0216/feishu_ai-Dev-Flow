services:
  api:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:api"
    ports:
      - "4000:4000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      LLM_PROVIDER: mock
    volumes:
      - .:/workspace

  web:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:web -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    volumes:
      - .:/workspace
    depends_on:
      - api
